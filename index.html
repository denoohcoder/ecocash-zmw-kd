<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoCash — Kashagi Loan Application</title>
  <style>
    :root {
      --eco-blue: #2743d6;
      --eco-blue-dark: #1b2fa8;
      --eco-red: #e01f26;
      --navy: #141b4d;
      --green: #1aa528;
      --green-accent: #22c12f;
      --ink: #1f2430;
      --muted: #6b7280;
      --muted-light: #9ca3af;
      --surface: #ffffff;
      --app-bg: #f1f2f6;
      --card-bg: #ffffff;
      --feature-bg: #eef1fb;
      --border: #e3e6ef;
      --radius: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img, svg { max-width: 100%; }

    .logo {
      font-weight: 800;
      font-size: 26px;
      color: var(--eco-blue);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--eco-red); }
    .logo--lg { font-size: 40px; text-align: center; }

    .logo-img {
      height: 40px;
      width: auto;
      flex: 0 0 auto;
      display: block;
      object-fit: contain;
    }
    .logo-img--lg {
      height: clamp(52px, 15vw, 70px);
      margin: 0 auto;
    }

    .login-body { background: var(--surface); }

    .login-screen {
      width: min(480px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: clamp(28px, 7vw, 48px);
      overflow: hidden;
    }

    .welcome-heading {
      text-align: center;
      font-weight: 400;
      font-size: clamp(26px, 8vw, 34px);
      color: #3a3f4b;
      margin: 24px 0 40px;
    }

    .login-top {
      padding: 0 clamp(20px, 6vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-field {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      border: 1.5px solid #c9ccd6;
      border-radius: 12px;
      padding: 16px 18px;
      gap: 14px;
    }
    .phone-prefix {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 18px;
      color: #3a3f4b;
    }
    .flag { font-size: 18px; }
    .phone-input {
      border: none;
      outline: none;
      font-size: 18px;
      flex: 1;
      color: #3a3f4b;
      background: transparent;
    }

    .pin-label {
      margin: 28px 0 14px;
      color: #3a3f4b;
      font-size: 17px;
    }
    .pin-group { display: flex; gap: clamp(8px, 3vw, 16px); }
    .pin-box {
      width: clamp(44px, 13vw, 56px);
      height: clamp(44px, 13vw, 56px);
      border: 2px solid #b9c0ec;
      border-radius: 14px;
      text-align: center;
      font-size: 24px;
      outline: none;
      transition: border-color .15s;
    }
    .pin-box:focus { border-color: var(--eco-blue); }

    .forgot-link {
      margin-top: 20px;
      color: #3a3f4b;
      text-decoration: none;
      font-size: 16px;
    }

    .login-curve {
      position: relative;
      width: 100%;
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }
    .login-curve::before {
      content: "";
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 480px;
      height: 400px;
      background: var(--eco-blue);
      border-radius: 50% 50% 0 0 / 60px 60px 0 0;
      z-index: 0;
    }
    .btn-login {
      position: relative;
      z-index: 1;
      width: 220px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #6f8fd6;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #5f80cd; }

    .login-bottom {
      background: var(--eco-blue);
      color: #fff;
      text-align: center;
      padding: 10px clamp(20px, 6vw, 32px) 48px;
      flex: 1;
    }
    .register-prompt {
      font-weight: 700;
      font-size: 16px;
      max-width: 360px;
      margin: 0 auto 22px;
    }
    .register-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .btn-pill {
      background: #fff;
      color: #1f2430;
      border: none;
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      flex: 1 1 140px;
      max-width: 180px;
    }
    .version { font-weight: 700; font-size: 14px; margin: 0 0 8px; }
    .terms { font-size: 13px; opacity: .95; margin: 0; }

    .otp-note {
      text-align: center;
      color: #3a3f4b;
      font-size: 16px;
      max-width: 360px;
      margin: 0 0 28px;
      line-height: 1.5;
    }
    .otp-note strong { display: block; margin-top: 4px; color: var(--ink); }
    .otp-group { gap: 10px; }
    .otp-box { width: clamp(40px, 12vw, 46px); height: clamp(48px, 13vw, 56px); font-size: 22px; }
    .otp-resend {
      margin-top: 22px;
      color: #3a3f4b;
      font-size: 15px;
    }
    .otp-resend a { color: var(--eco-blue); text-decoration: none; font-weight: 600; }
    .otp-resend a.is-disabled { color: var(--muted-light); pointer-events: none; }
    .otp-bottom { padding-top: 18px; }

    .app-body { background: var(--app-bg); padding: clamp(14px, 4vw, 24px) 16px; }

    .app-shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 14px;
      padding: clamp(18px, 5vw, 24px) clamp(16px, 5vw, 26px) clamp(24px, 6vw, 34px);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .app-shell--form { max-width: 460px; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-user { display: flex; flex-direction: column; align-items: center; }
    .header-welcome { font-weight: 700; font-size: 17px; margin-top: 2px; }
    .header-rule {
      height: 3px;
      background: var(--green);
      border-radius: 3px;
      margin: 14px 0 0;
    }

    .hero { text-align: center; margin: 26px 0 24px; }
    .hero-title { font-size: clamp(20px, 6vw, 24px); font-weight: 800; color: var(--green); margin: 0 0 8px; }
    .hero-title span { color: var(--eco-blue); }
    .hero-sub { color: var(--green-accent); font-size: 15px; margin: 0; }

    .loan-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: start;
    }

    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(18px, 5vw, 26px);
      box-shadow: 0 2px 10px rgba(20,27,77,.05);
    }
    .calc-card--solo { width: 100%; }
    .calc-title { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
    .calc-divider { border: none; border-top: 1px solid var(--border); margin: 0 0 22px; }

    .calc-label {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .5px;
      margin: 0 0 6px;
    }
    .calc-label--center { margin-top: 26px; }
    .calc-amount { text-align: center; font-size: clamp(28px, 8vw, 34px); font-weight: 800; margin: 0 0 16px; }

    .amount-input-wrap { margin-bottom: 18px; }
    .amount-input-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .amount-input {
      width: 100%;
      border: 1px solid #cdd1dc;
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
    }
    .amount-input:focus { border-color: var(--eco-blue); }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 6px;
      background: var(--navy);
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #c9ccd6;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #c9ccd6;
      cursor: pointer;
    }
    .slider-ends {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .calc-term { text-align: center; font-size: 22px; font-weight: 800; margin: 0 0 16px; }
    .term-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .term-btn {
      background: #f3f4f8;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #3a3f4b;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .term-btn.is-active {
      background: var(--green-accent);
      color: #fff;
      border-color: var(--green-accent);
    }

    .payment-box {
      background: var(--feature-bg);
      border-radius: var(--radius);
      text-align: center;
      padding: 18px;
      margin: 24px 0 20px;
    }
    .payment-label { color: var(--muted); font-size: 13px; letter-spacing: .5px; margin: 0 0 6px; }
    .payment-amount { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
    .payment-rate { color: var(--muted); font-size: 13px; margin: 0; }

    .btn-apply {
      width: 100%;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
    }
    .btn-apply:hover { background: #1d2566; }

    .form-title {
      text-align: center;
      color: var(--navy);
      font-size: clamp(22px, 7vw, 26px);
      font-weight: 800;
      margin: 24px 0 10px;
    }
    .form-intro {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .loan-form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-size: 16px; color: #3a3f4b; }
    .field-input {
      border: 1px solid #cdd1dc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: var(--ink);
      transition: border-color .15s;
      width: 100%;
    }
    .field-input:focus { border-color: var(--eco-blue); }
    select.field-input { appearance: auto; }

    .confirm-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      color: #3a3f4b;
      line-height: 1.4;
    }
    .confirm-row input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; }

    .btn-submit {
      background: var(--eco-blue-dark);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-submit:hover { background: #16267f; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy);
      color: #fff;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 360px) {
      .term-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="app-body">
  <div class="app-shell">
    <header class="app-header">
      <img src="assets/ecocash-logo.png" alt="EcoCash" class="logo-img" />
      <div class="header-user">
        <span class="user-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#2743d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21a8 8 0 0 1 16 0"></path>
          </svg>
        </span>
        <span class="header-welcome">Welcome</span>
      </div>
    </header>
    <div class="header-rule"></div>

    <section class="hero">
      <h1 class="hero-title">Get Your Loan Approved <span>Fast</span></h1>
      <p class="hero-sub">Quick approval • Competitive rates • Flexible terms</p>
    </section>

    <div class="loan-layout">
      <section class="calc-card calc-card--solo">
        <h2 class="calc-title">Loan Calculator</h2>
        <hr class="calc-divider" />

        <p class="calc-label">LOAN AMOUNT</p>
        <p class="calc-amount" id="loan-amount">$500</p>
        <div class="amount-input-wrap">
          <label class="amount-input-label" for="amount-input">Enter amount (USD 50–50,000)</label>
          <input
            type="number"
            id="amount-input"
            class="amount-input"
            min="50"
            max="50000"
            step="1"
            value="500"
            inputmode="numeric"
          />
        </div>
        <input
          type="range"
          id="amount-slider"
          class="slider"
          min="50"
          max="50000"
          step="1"
          value="500"
          aria-label="Loan amount"
        />
        <div class="slider-ends">
          <span>USD 50</span>
          <span>USD 50,000</span>
        </div>

        <p class="calc-label calc-label--center">LOAN TERM</p>
        <p class="calc-term" id="term-display">12 months</p>
        <div class="term-grid" id="term-grid">
          <button type="button" class="term-btn" data-term="6">6 months</button>
          <button type="button" class="term-btn is-active" data-term="12">12 months</button>
          <button type="button" class="term-btn" data-term="24">24 months</button>
          <button type="button" class="term-btn" data-term="36">36 months</button>
          <button type="button" class="term-btn" data-term="48">48 months</button>
          <button type="button" class="term-btn" data-term="60">60 months</button>
        </div>

        <div class="payment-box">
          <p class="payment-label">MONTHLY PAYMENT</p>
          <p class="payment-amount" id="monthly-payment">$42.69</p>
          <p class="payment-rate">Interest rate: 4.5% APR</p>
        </div>

        <button type="button" class="btn-apply" id="apply-now">APPLY NOW</button>
      </section>
    </div>
  </div>

  <script>
    /* EcoCash prototype — front-end only.
       This is a mock UI: no real payment/loan processing or backend calls. */

    (function () {
      "use strict";

      function toast(message) {
        var el = document.createElement("div");
        el.className = "toast";
        el.textContent = message;
        document.body.appendChild(el);
        requestAnimationFrame(function () { el.classList.add("show"); });
        setTimeout(function () {
          el.classList.remove("show");
          setTimeout(function () { el.remove(); }, 300);
        }, 2200);
      }

      var slider = document.getElementById("amount-slider");
      if (slider) {
        var amountEl = document.getElementById("loan-amount");
        var amountInput = document.getElementById("amount-input");
        var termDisplay = document.getElementById("term-display");
        var monthlyEl = document.getElementById("monthly-payment");
        var termGrid = document.getElementById("term-grid");
        var applyBtn = document.getElementById("apply-now");

        var MIN_AMOUNT = Number(slider.min);
        var MAX_AMOUNT = Number(slider.max);
        var ANNUAL_RATE = 0.045;
        var state = { amount: Number(slider.value), term: 12 };

        function fmt(n) {
          return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
        }

        function monthlyPayment(principal, months) {
          var r = ANNUAL_RATE / 12;
          if (r === 0) return principal / months;
          var m = principal * r / (1 - Math.pow(1 + r, -months));
          return m;
        }

        function render(syncAmountInput) {
          amountEl.textContent = fmt(state.amount);
          if (syncAmountInput) amountInput.value = String(state.amount);
          termDisplay.textContent = state.term + " months";
          var pay = monthlyPayment(state.amount, state.term);
          monthlyEl.textContent = "$" + pay.toLocaleString("en-US", {
            minimumFractionDigits: 2, maximumFractionDigits: 2
          });
        }

        slider.addEventListener("input", function () {
          state.amount = Number(slider.value);
          render(true);
        });

        amountInput.addEventListener("input", function () {
          var amount = Number(amountInput.value);
          if (amountInput.value === "" || !Number.isFinite(amount) || amount < MIN_AMOUNT || amount > MAX_AMOUNT) return;
          state.amount = Math.round(amount);
          slider.value = String(state.amount);
          render(false);
        });

        amountInput.addEventListener("change", function () {
          var amount = Number(amountInput.value);
          if (amountInput.value === "" || !Number.isFinite(amount)) amount = MIN_AMOUNT;
          state.amount = Math.min(MAX_AMOUNT, Math.max(MIN_AMOUNT, Math.round(amount)));
          slider.value = String(state.amount);
          render(true);
        });

        termGrid.addEventListener("click", function (e) {
          var btn = e.target.closest(".term-btn");
          if (!btn) return;
          termGrid.querySelectorAll(".term-btn").forEach(function (b) {
            b.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          state.term = Number(btn.dataset.term);
          render(false);
        });

        applyBtn.addEventListener("click", function () {
          var params = new URLSearchParams({
            amount: String(state.amount),
            term: String(state.term)
          });
          window.location.href = "details.html?" + params.toString();
        });

        render(true);
      }
    })();
  </script>
</body>
</html>
